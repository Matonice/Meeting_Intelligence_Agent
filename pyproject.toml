[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-intelligence-agent"
version = "0.1.0"
description = "Turn meeting recordings into structured knowledge"
requires-python = ">=3.10"
dependencies = [
    "pydub>=0.25.1",
    "numpy>=1.24",
    "silero-vad>=5.1",
    "torch>=2.0",
    "torchaudio>=2.0",
    "pyannote.audio>=3.1",
    "faster-whisper>=1.0",
    "openai>=1.40",
    "tiktoken>=0.7",
    "pydantic>=2.8",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.0",
    "edge-tts>=6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.0",
]

[project.scripts]
meeting-intel = "meeting_intelligence.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring model downloads or API keys",
]
